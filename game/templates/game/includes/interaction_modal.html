<div id="interaction-modal" class="interaction-modal">

    <div class="interaction-window">

        <button class="interaction-close" onclick="closeInteraction()">
            ×
        </button>

        <img id="interaction-image" src="" alt="">

        <div class="interaction-content">

            <h2 id="interaction-title"></h2>

            <p id="interaction-text"></p>

            <div id="interaction-reward"></div>

            <button
                class="interaction-button"
                onclick="closeInteraction()"
            >
                Закрыть
            </button>

        </div>

    </div>

</div>
